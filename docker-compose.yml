name: diri-persola-dev

x-logging: &minimal-logging
  driver: "local"
  options:
    max-size: "1m"
    max-file: "1"
    compress: "false"

services:
  persola-db:
    image: postgres:16-alpine
    container_name: persola-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepiri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepiripassword}
      POSTGRES_DB: ${POSTGRES_DB:-persola}
    volumes:
      - persola_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepiri} -d ${POSTGRES_DB:-persola}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diri-persola-dev-network

  persola:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: diri-persola-dev-api:latest
    pull_policy: never
    container_name: diri-persola-api-dev
    restart: unless-stopped
    logging: *minimal-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 8002
      DEBUG: "true"
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-deepiri}:${POSTGRES_PASSWORD:-deepiripassword}@persola-db:5432/${POSTGRES_DB:-persola}
      OLLAMA_BASE_URL: ${PERSOLA_OLLAMA_BASE_URL:-http://host.docker.internal:11435}
      DEFAULT_MODEL: llama3:8b
      DEFAULT_PROVIDER: ollama
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CYREX_URL: ${CYREX_URL:-}
      CYREX_API_KEY: ${CYREX_API_KEY:-}
      PERSOLA_CITY_COMMONS_ROOT: ${PERSOLA_CITY_COMMONS_ROOT:-}
    ports:
      - "8010:8002"
    volumes:
      - ./:/app
    command: uvicorn persola.api.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/city/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      persola-db:
        condition: service_healthy
    networks:
      - diri-persola-dev-network

  persola-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: diri-persola-dev-ui:latest
    pull_policy: never
    container_name: diri-persola-ui-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "3000:3000"
    depends_on:
      - persola
    networks:
      - diri-persola-dev-network

volumes:
  persola_db_data:

networks:
  diri-persola-dev-network:
    name: diri-persola-dev-network
    driver: bridge
