# Production-oriented overlay — run from repo root:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Fixes build context to this repo and runs uvicorn with workers (no --reload).

services:
  persola:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DEBUG: "false"
      PERSOLA_WORKERS: ${PERSOLA_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CYREX_URL: ${CYREX_URL:-}
      CYREX_API_KEY: ${CYREX_API_KEY:-}
      PERSOLA_CITY_COMMONS_ROOT: ${PERSOLA_CITY_COMMONS_ROOT:-/var/persola/commons}
    volumes:
      - ./:/app
      - persola_commons:/var/persola/commons
    command:
      [
        "uvicorn",
        "persola.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--workers",
        "${PERSOLA_WORKERS:-2}",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
      ]

  persola-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile

volumes:
  persola_commons:
